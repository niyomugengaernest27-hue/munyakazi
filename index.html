<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>munyakazi space shop</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
   
<header>
       <a href="ernest.html"> <h1>Munyakazi Work Space</h1></a>
    
        <p>Organize your tasks, notes, and daily workflow in one place.</p>
    </header>

 <form class="form">
<label>Name: 
    <input required type="text" placeholder="ernest munyakazi">
</label>
        <label>Email: 
           <input required type="email" placeholder="ernest@gmail.com">
        </label>
        
    </form>
    
    <main class="container">
        <!-- Task Manager Section -->
        <section class="card">
             <a href="iflame.html">
                 <h2>Task Board</h2>
             </a>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task..." required>
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <!-- Quick Notes Section -->
        <section class="card">
            <h2>Quick Notes</h2>
            <textarea id="noteArea" placeholder="Write your project ideas or reminders here..."></textarea>
            <button class="save-btn" onclick="saveNote()">Save Note</button>
            <p id="statusMsg" class="status"></p>
        </section>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>munyakazi space shop</title>
</head>
<body>
<header>
        <h1>Munyakazi Work Space</h1>
        <p>Organize your tasks, notes, and daily workflow in one place.</p>
    </header>

    <main class="container">
        <!-- Task Manager Section -->
        <section class="card">
            <h2>Task Board</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <!-- Quick Notes Section -->
        <section class="card">
            <h2>Quick Notes</h2>
            <textarea id="noteArea" placeholder="Write your project ideas or reminders here..."></textarea>
            <button class="save-btn" onclick="saveNote()">Save Note</button>
            <p id="statusMsg" class="status"></p>
        </section>
    </main>

</body>
</html>
